<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WarPig Telemetry</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .item {
      margin: 6px 0;
    }
  </style>
</head>
<body>

<h1>🐗 WarPig Telemetry 🐗</h1>

<div class="item">Build#: <span id="version">-</span></div>
<div class="item">IP: <span id="ip">-</span></div>
<div class="item">Uptime: <span id="uptime">-</span></div>
<div class="item">CPU: <span id="cpu">-</span>%</div>

<hr>
<div class="item">
  WiFi <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 18c.828 0 1.5.672 1.5 1.5S12.828 21 12 21s-1.5-.672-1.5-1.5S11.172 18 12 18zm6.364-3.364a9 9 0 00-12.728 0l1.414 1.414a7 7 0 0110.9 0l1.414-1.414zm-3.536-3.536a5 5 0 00-7.072 0l1.414 1.414a3 3 0 014.244 0l1.414-1.414z"/>
  </svg>
  (current): <span id="wifi_now">-</span>
</div>
<div class="item">
  WiFi <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 18c.828 0 1.5.672 1.5 1.5S12.828 21 12 21s-1.5-.672-1.5-1.5S11.172 18 12 18zm6.364-3.364a9 9 0 00-12.728 0l1.414 1.414a7 7 0 0110.9 0l1.414-1.414zm-3.536-3.536a5 5 0 00-7.072 0l1.414 1.414a3 3 0 014.244 0l1.414-1.414z"/>
  </svg>
  (total): <span id="wifi_total">-</span>
</div>

<div class="item">
  Bluetooth <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0v24l6-6-4-4 4-4-6-6zm1 6.414L14.586 8 13 9.586V6.414zM13 14.414V11.586L14.586 13 13 14.414z"/>
  </svg>
  (current): <span id="bt_now">-</span>
</div>
<div class="item">
  Bluetooth <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 0v24l6-6-4-4 4-4-6-6zm1 6.414L14.586 8 13 9.586V6.414zM13 14.414V11.586L14.586 13 13 14.414z"/>
  </svg>
  (total): <span id="bt_total">-</span>
</div>


<script>
async function updateTelemetry() {
  try {
    const response = await fetch("http://192.168.0.125:8081/status");
    const data = await response.json();

    document.getElementById("version").textContent = data.version;
    document.getElementById("ip").textContent = data.ip;
    document.getElementById("uptime").textContent = data.uptime;
    document.getElementById("cpu").textContent = data.cpu;

    document.getElementById("wifi_now").textContent = data.wifi_now;
    document.getElementById("wifi_total").textContent = data.wifi_total;
    document.getElementById("bt_now").textContent = data.bt_now;
    document.getElementById("bt_total").textContent = data.bt_total;
  } catch (err) {
    console.error("Failed to fetch telemetry:", err);
  }
}

// Refresh every second
setInterval(updateTelemetry, 1000);
updateTelemetry();
</script>

</body>
</html>
