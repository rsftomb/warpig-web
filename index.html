<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🐗 WarPi.G WebUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      margin: 0;
      padding-top: 60px;  /* header */
      padding-bottom: 60px; /* footer */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header.header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 0;
      background: #000;
      border-bottom: 1px solid #0f0;
      color: #0f0;
      text-align: center;
      font-size: 18px;
    }

    .subtitle {
      display: block;
      font-size: 12px;
      color: #0a0;
      font-style: italic;
    }

    .content {
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .item svg {
      margin-right: 4px;
      vertical-align: middle;
    }

    hr {
      width: 100%;
      border: 0;
      border-top: 1px solid #0f0;
      margin: 10px 0;
    }

    footer.footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 0;
      background: #000;
      border-top: 1px solid #0f0;
      color: #0f0;
      font-size: 12px;
      text-align: center;
    }

    .disclaimer {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: #0a0;
      font-style: italic;
    }
  </style>
</head>
<body>

<header class="header">
  🐗 WarPi.G WebUI
  <span class="subtitle">WarPi.G Wardriving Dashboard</span>
</header>

<div class="content">
  
  <div class="item">Build#: <span id="version">-</span></div>
  <div class="item">IP: <span id="ip">-</span></div>
  <div class="item">Uptime: <span id="uptime">-</span></div>
  <div class="item">CPU: <span id="cpu">-</span>%</div>


  <div class="item">WiFi <span>(current): <span id="wifi_now">-</span></span></div>
  <div class="item">WiFi <span>(total): <span id="wifi_total">-</span></span></div>

  <div class="item">Bluetooth <span>(current): <span id="bt_now">-</span></span></div>
  <div class="item">Bluetooth <span>(total): <span id="bt_total">-</span></span></div>
</div>

<script>
async function updateTelemetry() {
  try {
    const response = await fetch("http://192.168.0.125:8081/status");
    const data = await response.json();

    document.getElementById("version").textContent = data.version;
    document.getElementById("ip").textContent = data.ip;
    document.getElementById("uptime").textContent = data.uptime;
    document.getElementById("cpu").textContent = data.cpu;

    document.getElementById("wifi_now").textContent = data.wifi_now;
    document.getElementById("wifi_total").textContent = data.wifi_total;
    document.getElementById("bt_now").textContent = data.bt_now;
    document.getElementById("bt_total").textContent = data.bt_total;
  } catch (err) {
    console.error("Failed to fetch telemetry:", err);
  }
}

setInterval(updateTelemetry, 1000);
updateTelemetry();
</script>

<footer class="footer">
  &copy; 2025-2026 WarPi.G Zero2W
  <span class="disclaimer">Disclaimer: Data is for legal monitoring purposes only. Use at your own risk.</span>
</footer>

</body>
</html>
