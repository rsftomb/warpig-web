<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🐗 WarPi.G WebUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      margin: 0;
      padding-top: 60px;  /* header */
      padding-bottom: 60px; /* footer */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header.header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 0;
      background: #000;
      border-bottom: 1px solid #0f0;
      color: #0f0;
      text-align: center;
      font-size: 18px;
    }

    .subtitle {
      display: block;
      font-size: 12px;
      color: #0a0;
      font-style: italic;
    }

    .content {
      width: 90%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .item svg {
      margin-right: 4px;
      vertical-align: middle;
    }

    .sublist {
      grid-column: span 2;
      margin: 0 0 8px 16px;
      font-size: 12px;
      color: #0a0;
    }

    hr {
      grid-column: span 2;
      border: 0;
      border-top: 1px solid #0f0;
      margin: 10px 0;
    }

    footer.footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px 0;
      background: #000;
      border-top: 1px solid #0f0;
      color: #0f0;
      font-size: 12px;
      text-align: center;
    }

    .disclaimer {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: #0a0;
      font-style: italic;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 4px;
    }

    .active {
      background: #0f0;
    }

    @media(max-width: 350px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header class="header">
  🐗 WarPi.G WebUI
  <span class="subtitle">WarPi.G Wardriving Dashboard</span>
</header>

<div class="content">
  <div class="item"><span>Build#:</span> <span id="version">-</span></div>
  <div class="item"><span>IP:</span> <span id="ip">-</span></div>
  <div class="item"><span>Uptime:</span> <span id="uptime">-</span></div>
  <div class="item"><span>CPU:</span> <span id="cpu">-</span>%</div>

  <hr>

  <div class="item">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0">
      <path d="M12 18c.828 0 1.5.672 1.5 1.5S12.828 21 12 21s-1.5-.672-1.5-1.5S11.172 18 12 18zm6.364-3.364a9 9 0 00-12.728 0l1.414 1.414a7 7 0 0110.9 0l1.414-1.414zm-3.536-3.536a5 5 0 00-7.072 0l1.414 1.414a3 3 0 014.244 0l1.414-1.414z"/>
    </svg>
    <span>WiFi (current):</span> <span id="wifi_now">-</span>
    <span class="dot" id="wifi_dot"></span>
  </div>

  <div class="item">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0">
      <path d="M12 18c.828 0 1.5.672 1.5 1.5S12.828 21 12 21s-1.5-.672-1.5-1.5S11.172 18 12 18zm6.364-3.364a9 9 0 00-12.728 0l1.414 1.414a7 7 0 0110.9 0l1.414-1.414zm-3.536-3.536a5 5 0 00-7.072 0l1.414 1.414a3 3 0 014.244 0l1.414-1.414z"/>
    </svg>
    <span>WiFi (total):</span> <span id="wifi_total">-</span>
  </div>

  <div class="sublist" id="wifi_list">SSIDs: -</div>

  <div class="item">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0">
      <path d="M12 0v24l6-6-4-4 4-4-6-6zm1 6.414L14.586 8 13 9.586V6.414zM13 14.414V11.586L14.586 13 13 14.414z"/>
    </svg>
    <span>Bluetooth (current):</span> <span id="bt_now">-</span>
    <span class="dot" id="bt_dot"></span>
  </div>

  <div class="item">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#0f0">
      <path d="M12 0v24l6-6-4-4 4-4-6-6zm1 6.414L14.586 8 13 9.586V6.414zM13 14.414V11.586L14.586 13 13 14.414z"/>
    </svg>
    <span>Bluetooth (total):</span> <span id="bt_total">-</span>
  </div>

  <div class="sublist" id="bt_list">Devices: -</div>

</div>

<script>
async function updateTelemetry() {
  try {
    const response = await fetch("http://192.168.0.125:8081/status");
    const data = await response.json();

    document.getElementById("version").textContent = data.version;
    document.getElementById("ip").textContent = data.ip;
    document.getElementById("uptime").textContent = data.uptime;
    document.getElementById("cpu").textContent = data.cpu;

    document.getElementById("wifi_now").textContent = data.wifi_now;
    document.getElementById("wifi_total").textContent = data.wifi_total;
    document.getElementById("bt_now").textContent = data.bt_now;
    document.getElementById("bt_total").textContent = data.bt_total;

    document.getElementById("wifi_list").textContent = "SSIDs: " + (data.wifi_seen.length ? data.wifi_seen.join(", ") : "-");
    document.getElementById("bt_list").textContent = "Devices: " + (data.bt_seen.length ? data.bt_seen.join(", ") : "-");

    // Live dot indicators
    document.getElementById("wifi_dot").className = data.wifi_now ? "dot active" : "dot";
    document.getElementById("bt_dot").className = data.bt_now ? "dot active" : "dot";

  } catch (err) {
    console.error("Failed to fetch telemetry:", err);
  }
}

setInterval(updateTelemetry, 1000);
updateTelemetry();
</script>

<footer class="footer">
  &copy; 2025-2026 WarPi.G Zero2W
  <span class="disclaimer">Disclaimer: Data is for legal monitoring purposes only. Use at your own risk.</span>
</footer>

</body>
</html>
