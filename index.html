<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WarPig Telemetry</title>
  <style>
    body {
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .item {
      margin: 6px 0;
    }
  </style>
</head>
<body>

<h1>🐗 WarPig Telemetry</h1>

<div class="item">Version: <span id="version">-</span></div>
<div class="item">IP: <span id="ip">-</span></div>
<div class="item">Uptime: <span id="uptime">-</span></div>
<div class="item">CPU: <span id="cpu">-</span>%</div>

<hr>

<div class="item">WiFi (current): <span id="wifi_now">-</span></div>
<div class="item">WiFi (total): <span id="wifi_total">-</span></div>

<div class="item">Bluetooth (current): <span id="bt_now">-</span></div>
<div class="item">Bluetooth (total): <span id="bt_total">-</span></div>

<script>
async function update() {
  try {
    // Make sure this points to your Python web server port
    const response = await fetch("http://localhost:8081/status");
    const data = await response.json();

    document.getElementById("version").textContent = data.version;
    document.getElementById("ip").textContent = data.ip;
    document.getElementById("uptime").textContent = data.uptime;
    document.getElementById("cpu").textContent = data.cpu;

    document.getElementById("wifi_now").textContent = data.wifi_now;
    document.getElementById("wifi_total").textContent = data.wifi_total;
    document.getElementById("bt_now").textContent = data.bt_now;
    document.getElementById("bt_total").textContent = data.bt_total;
  } catch (err) {
    console.error("Failed to fetch telemetry:", err);
  }
}

// Update every second
setInterval(update, 1000);
update();
</script>

</body>
</html>
